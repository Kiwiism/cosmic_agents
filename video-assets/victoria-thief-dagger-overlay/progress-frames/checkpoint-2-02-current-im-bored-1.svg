<svg xmlns="http://www.w3.org/2000/svg" width="460" height="560" viewBox="0 0 460 560">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000814" flood-opacity=".46"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .label { font-size: 14px; font-weight: 800; letter-spacing: 1.8px; fill: #142335; }
      .title { font-size: 24px; font-weight: 800; fill: #fff8e7; }
      .section { font-size: 14px; font-weight: 800; letter-spacing: 1.4px; fill: #f6c85f; }
      .item { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .detail { font-size: 15px; font-weight: 500; fill: #b9c8d9; }
      .box { fill: #0d1a29; stroke: #d9bd77; stroke-width: 2; }
      .rule { stroke: #36516b; stroke-width: 1; opacity: .72; }
    </style>
  </defs>
  <rect x="12" y="12" width="436" height="536" rx="22" fill="#142335" fill-opacity=".95"
        stroke="#d9bd77" stroke-width="2" filter="url(#shadow)"/>
  <path d="M34 12h392a22 22 0 0 1 22 22v51H12V34a22 22 0 0 1 22-22z" fill="#f6c85f"/>
  <text class="sans label" x="34" y="43">CHECKPOINT 2 / 3</text>
  <text class="sans title" x="34" y="72">Kerning City Quests</text>
  <text class="sans section" x="34" y="116">QUEST OBJECTIVES</text>

  <rect class="box" x="34" y="139" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="157">Intimidating Octopuses</text>
  <text class="sans detail" x="70" y="181">Defeat 30 Octopuses</text>
  <line class="rule" x1="34" y1="200" x2="426" y2="200"/>

  <rect class="box" x="34" y="218" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="236">I’m Bored 1</text>
  <text class="sans detail" x="70" y="260">Speak with Icarus</text>
  <line class="rule" x1="34" y1="279" x2="426" y2="279"/>

  <rect class="box" x="34" y="297" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="315">I’m Bored 2</text>
  <text class="sans detail" x="70" y="339">Collect 40 Tree Branches</text>
  <text class="sans detail" x="70" y="362">Collect 40 Squishy Liquids</text>
  <line class="rule" x1="34" y1="381" x2="426" y2="381"/>

  <rect class="box" x="34" y="399" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="417">Pigs at the Corner</text>
  <text class="sans detail" x="70" y="441">Defeat 30 Pigs</text>
  <line class="rule" x1="34" y1="460" x2="426" y2="460"/>

  <rect class="box" x="34" y="478" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="496">That Red Isn’t For Everyone!</text>
  <text class="sans detail" x="70" y="520">Defeat 30 Ribbon Pigs</text>


  <g aria-label="completed" transform="translate(45 150)">
    <circle r="14" fill="#43c77b" stroke="#e8fff1" stroke-width="2"/>
    <path d="M-7 .2l4.3 4.4L7.5-5.6" fill="none" stroke="#ffffff"
          stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g aria-label="current objective" transform="translate(45 229)">
    <circle r="14" fill="#f6c85f" stroke="#fff8e7" stroke-width="2"/>
    <path d="M-3.5-6.5L7 0-3.5 6.5z" fill="#142335"/>
  </g>
</svg>
