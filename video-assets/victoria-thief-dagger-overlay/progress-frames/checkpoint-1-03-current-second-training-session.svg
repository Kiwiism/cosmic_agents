<svg xmlns="http://www.w3.org/2000/svg" width="460" height="615" viewBox="0 0 460 615">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000814" flood-opacity=".46"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .label { font-size: 14px; font-weight: 800; letter-spacing: 1.8px; fill: #142335; }
      .title { font-size: 23px; font-weight: 800; fill: #fff8e7; }
      .section { font-size: 14px; font-weight: 800; letter-spacing: 1.4px; fill: #f6c85f; }
      .item { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .detail { font-size: 15px; font-weight: 500; fill: #b9c8d9; }
      .box { fill: #0d1a29; stroke: #d9bd77; stroke-width: 2; }
      .rule { stroke: #36516b; stroke-width: 1; opacity: .72; }
    </style>
  </defs>
  <rect x="12" y="12" width="436" height="591" rx="22" fill="#142335" fill-opacity=".95"
        stroke="#d9bd77" stroke-width="2" filter="url(#shadow)"/>
  <path d="M34 12h392a22 22 0 0 1 22 22v51H12V34a22 22 0 0 1 22-22z" fill="#f6c85f"/>
  <text class="sans label" x="34" y="43">CHECKPOINT 1 / 3</text>
  <text class="sans title" x="34" y="72">Job Advancement &amp; Training</text>

  <text class="sans section" x="34" y="116">TRAINING WITH JOB INSTRUCTOR</text>

  <rect class="box" x="34" y="139" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="157">Advance to Thief</text>
  <line class="rule" x1="34" y1="178" x2="426" y2="178"/>

  <rect class="box" x="34" y="196" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="214">First Training Session</text>
  <text class="sans detail" x="70" y="238">Defeat 20 Stumps</text>
  <line class="rule" x1="34" y1="257" x2="426" y2="257"/>

  <rect class="box" x="34" y="275" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="293">Second Training Session</text>
  <text class="sans detail" x="70" y="317">Defeat 50 Stumps</text>
  <line class="rule" x1="34" y1="336" x2="426" y2="336"/>

  <rect class="box" x="34" y="354" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="372">Third Training Session</text>
  <text class="sans detail" x="70" y="396">Defeat 80 Stumps</text>
  <line class="rule" x1="34" y1="415" x2="426" y2="415"/>

  <rect class="box" x="34" y="433" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="451">Last Training Session</text>
  <text class="sans detail" x="70" y="475">Defeat 10 Octopuses</text>

  <rect x="28" y="500" width="404" height="1" fill="#d9bd77" opacity=".55"/>
  <text class="sans section" x="34" y="530">STOCK UP</text>
  <rect class="box" x="34" y="550" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="568">Buy potions and supplies</text>

  <g aria-label="completed" transform="translate(45 150)">
    <circle r="14" fill="#43c77b" stroke="#e8fff1" stroke-width="2"/>
    <path d="M-7 .2l4.3 4.4L7.5-5.6" fill="none" stroke="#ffffff"
          stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g aria-label="completed" transform="translate(45 207)">
    <circle r="14" fill="#43c77b" stroke="#e8fff1" stroke-width="2"/>
    <path d="M-7 .2l4.3 4.4L7.5-5.6" fill="none" stroke="#ffffff"
          stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g aria-label="current objective" transform="translate(45 286)">
    <circle r="14" fill="#f6c85f" stroke="#fff8e7" stroke-width="2"/>
    <path d="M-3.5-6.5L7 0-3.5 6.5z" fill="#142335"/>
  </g>
