<svg xmlns="http://www.w3.org/2000/svg" width="460" height="615" viewBox="0 0 460 615">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000814" flood-opacity=".46"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .label { font-size: 14px; font-weight: 800; letter-spacing: 1.8px; fill: #10243a; }
      .title { font-size: 24px; font-weight: 800; fill: #10243a; }
      .section { font-size: 14px; font-weight: 800; letter-spacing: 1.4px; fill: #8ed6ff; }
      .item { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .detail { font-size: 15px; font-weight: 500; fill: #c7e7f7; }
      .box { fill: #0a1a2a; stroke: #8ed6ff; stroke-width: 2; }
      .rule { stroke: #3f6c8e; stroke-width: 1; opacity: .78; }
    </style>
  </defs>
  <rect x="12" y="12" width="436" height="591" rx="22" fill="#10243a" fill-opacity=".95"
        stroke="#8ed6ff" stroke-width="2" filter="url(#shadow)"/>
  <path d="M34 12h392a22 22 0 0 1 22 22v51H12V34a22 22 0 0 1 22-22z" fill="#9edcff"/>
  <text class="sans label" x="34" y="43">CHECKPOINT 3 / 3</text>
  <text class="sans title" x="34" y="72">Nautilus Harbor Quests</text>
  <text class="sans section" x="34" y="116">QUEST OBJECTIVES</text>

  <rect class="box" x="34" y="139" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="157">Destructively Strong Pigs</text>
  <text class="sans detail" x="70" y="181">Defeat 30 Pigs</text>
  <line class="rule" x1="34" y1="200" x2="426" y2="200"/>

  <rect class="box" x="34" y="218" width="22" height="22" rx="4"/>
