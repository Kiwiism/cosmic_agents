  <text class="sans item" x="70" y="337">Orange Mushrooms?</text>
  <text class="sans detail" x="70" y="361">Defeat 30 Orange Mushrooms</text>
  <line class="rule" x1="34" y1="380" x2="426" y2="380"/>

  <rect class="box" x="34" y="398" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="416">Camouflaging Slimes</text>
  <text class="sans detail" x="70" y="440">Defeat 30 Slimes</text>

  <rect x="28" y="469" width="404" height="1" fill="#8ed6ff" opacity=".62"/>
  <text class="sans section" x="34" y="499">FINAL GOAL</text>
  <rect class="box" x="34" y="519" width="22" height="22" rx="4"/>
  <text class="sans item" x="70" y="537">Reach Level 15</text>

  <g aria-label="completed" transform="translate(45 150)">
    <circle r="14" fill="#43c77b" stroke="#e8fff1" stroke-width="2"/>
    <path d="M-7 .2l4.3 4.4L7.5-5.6" fill="none" stroke="#ffffff"
