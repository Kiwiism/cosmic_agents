    # Values: a finite non-negative integer. Recommended: 37-150 around the tested baseline 75; benchmark or observe behavior before moving outside this band.
    # Purpose: Sets an Agent's starting initial energy before current conditions adjust it. Higher values make that tendency stronger from the start; lower values make it weaker.
    # Technical: the "behavior adaptation state" component consumes this as an integer. Domain: component-specific policy value; startup validation rejects missing, blank, or malformed values.
    server.agents.behavior.AgentBehaviorAdaptationState.INITIAL_ENERGY: '75'
    # Values: a finite non-negative integer. Recommended: 2-10 around the tested baseline 5; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how quickly an Agent's kill confidence adapts after this event. Values farther from zero cause a larger behavior change; values nearer zero make adaptation more gradual.
    # Technical: the "behavior adaptation state" component consumes this as an integer. Domain: component-specific policy value; startup validation rejects missing, blank, or malformed values. The owning adaptation state adds or subtracts this magnitude per event and clamps the result to its configured state bounds.
