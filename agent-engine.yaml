# Strict runtime/algorithm tuning. Keys mirror declaring classes for traceability.
tuning:
    # Values: a positive integer; unit: milliseconds. Recommended: 15000-60000; 30000 allows one bounded plan step to settle without making ownership replacement unbounded.
    # Purpose: Sets the default deadline for a universal quest plan to finish its current atomic step before a forced ownership release.
    # Technical: This deadline applies only to foreground replacement requests without a caller-authored deadline; explicit plan session exit requests retain their own validated timing.
    server.agents.plans.AgentUniversalPlanRuntime.DEFAULT_GRACEFUL_EXIT_TIMEOUT_MS: '30000'
    # Values: a positive integer; unit: milliseconds. Recommended: 250-1000; 500 preserves the validated simulation cadence.
    # Purpose: Controls how often automatic logical-time advancement polls for additional due economy work.
    # Technical: This is the process-level automatic economy scheduler interval; it controls polling frequency without changing logical event timestamps or scenario-authored session durations.
    server.agents.economy.integration.cosmic.EconomySimulationRuntime.AUTO_ADVANCE_POLL_MS: '500'
    # Values: a positive integer. Recommended: 32-128; 64 bounds work per automatic scheduler pass.
    # Purpose: Limits how many due economy actions one automatic advancement pass may process before yielding.
    # Technical: This is a scheduling fairness and latency bound; it neither limits Agent population nor changes market capacity, session ownership, or scenario admission policy.
    server.agents.economy.integration.cosmic.EconomySimulationRuntime.AUTO_ADVANCE_BATCH_ACTIONS: '64'
    # Values: a positive integer; unit: milliseconds. Recommended: 500-2000; 1000 preserves the validated real-time cadence.
    # Purpose: Controls how often real-time economy mode polls its logical clock for newly due scenario work.
    # Technical: This is the process-level real-time scheduler interval; economic visit durations, idle deadlines, and market actions remain owned by the loaded economy scenario configuration.
    server.agents.economy.integration.cosmic.EconomySimulationRuntime.REALTIME_POLL_MS: '1000'
    # Independent Kiwi observer showcase
    # Values: 25-100 milliseconds. Recommended: 50. Lower values make Kiwi's server-driven walking smoother; higher values reduce work but can make motion look stepped.
    # Purpose: Sets how often only the independent observer controller updates. This does not change normal Agent plan, combat, or TownLife scheduling.
    # Technical: Dedicated fixed-rate observer scheduler cadence in milliseconds; it bounds how often observer policy and movement are evaluated without changing the normal Agent scheduler cadence.
    server.agents.observer.AgentObserverRuntime.TICK_MS: '50'
    # Values: 70-180 map pixels. Recommended: 110. Higher values make Kiwi observe from farther away; lower values make Kiwi stand closer to the watched character.
    # Purpose: Controls Kiwi's normal following distance after Bari's Test is complete.
    # Technical: Horizontal map-pixel offset used by the SHADOWING stage when the observer movement controller derives a grounded destination beside the watched character.
    server.agents.observer.AgentObserverRuntime.SHADOW_DISTANCE_PX: '110'
    # Values: 25-90 map pixels. Recommended: 55. Higher values keep more space during an F1 investigation; lower values make Kiwi approach more closely.
    # Purpose: Controls how close Kiwi gets before showing the suspicious F3 expression.
    # Technical: Horizontal map-pixel offset used only by the INVESTIGATING stage when deriving the observer's grounded inspection destination beside the watched character.
    server.agents.observer.AgentObserverRuntime.INVESTIGATION_DISTANCE_PX: '55'
    # Values: 6000-30000 milliseconds. Recommended: 12000. Higher values make Kiwi linger longer in each Maple Island map; lower values make the patrol advance sooner.
    # Purpose: Sets the shortest casual idle between ordinary roaming-map transitions.
    # Technical: Inclusive millisecond lower bound sampled by observer policy whenever the ordinary roaming state schedules its next map transition.
    server.agents.observer.AgentObserverPolicy.IDLE_MIN_MS: '12000'
    # Values: 12000-60000 milliseconds. Recommended: 30000 and no lower than IDLE_MIN_MS. Higher values produce a slower, more patient patrol.
    # Purpose: Sets the longest casual idle between ordinary roaming-map transitions.
    # Technical: Inclusive millisecond upper bound sampled by observer policy whenever the ordinary roaming state schedules its next map transition.
    server.agents.observer.AgentObserverPolicy.IDLE_MAX_MS: '30000'
    # Values: 2000-8000 milliseconds. Recommended: 3500. Higher values make training-map spot checks last longer.
    # Purpose: Sets the shortest time Kiwi briefly observes an isolated Mai training map before returning to the three-map cycle.
    # Technical: Inclusive millisecond lower bound sampled after the observer enters an isolated training-map excursion before it resumes the normal roaming route.
    server.agents.observer.AgentObserverPolicy.EXCURSION_MIN_MS: '3500'
    # Values: 4000-15000 milliseconds. Recommended: 7000 and no lower than EXCURSION_MIN_MS. Higher values make isolated training-map spot checks more noticeable.
    # Purpose: Sets the longest time Kiwi remains in an isolated Mai training map.
    # Technical: Inclusive millisecond upper bound sampled after the observer enters an isolated training-map excursion before it resumes the normal roaming route.
    server.agents.observer.AgentObserverPolicy.EXCURSION_MAX_MS: '7000'
    # Values: 0-100 percent. Recommended: 15. Higher values make Kiwi interrupt the normal Dangerous Forest-Amherst-Mai cycle with isolated-map checks more often.
    # Purpose: Controls how often a completed cycle-map idle becomes a brief training-map observation.
    # Technical: Integer percentage threshold applied to one independent random roll at each eligible observer roaming-cycle decision boundary.
    server.agents.observer.AgentObserverPolicy.EXCURSION_CHANCE_PERCENT: '15'
    # Values: 2000-10000 milliseconds. Recommended: 5000. Higher values make Kiwi glare suspiciously for longer after reaching the F1 caller.
    # Purpose: Controls the visible pause at the end of an F1 investigation.
    # Technical: Millisecond dwell scheduled after expression 3 is broadcast and the observer has reached its inspection destination, before normal roaming resumes.
    server.agents.observer.AgentObserverPolicy.INVESTIGATION_HOLD_MS: '5000'
    # Values: 10000-60000 milliseconds. Recommended: 30000. Higher values give Kiwi more time to navigate across several maps before abandoning an unreachable F1 investigation.
    # Purpose: Bounds a failed or obstructed investigation so the normal roaming cycle always resumes.
    # Technical: Millisecond hard deadline measured from entry into the INVESTIGATING stage; expiry releases a failed or unreachable inspection and restores normal roaming.
    server.agents.observer.AgentObserverPolicy.INVESTIGATION_TIMEOUT_MS: '30000'
    # Values: 5000-30000 milliseconds. Recommended: 15000. Higher values make Kiwi change Lith Harbor idle spots less often.
    # Purpose: Sets the shortest idle between Kiwi's Lith Harbor spot changes after Shanks administration.
    # Technical: Inclusive millisecond lower bound sampled for each observer idle period after the showcase has transitioned into its terminal Lith Harbor phase.
    server.agents.observer.AgentObserverPolicy.LITH_IDLE_MIN_MS: '15000'
    # Values: 15000-60000 milliseconds. Recommended: 35000 and no lower than LITH_IDLE_MIN_MS. Higher values make Kiwi settle at each Lith Harbor spot longer.
    # Purpose: Sets the longest idle between Kiwi's Lith Harbor spot changes.
    # Technical: Inclusive millisecond upper bound sampled for each observer idle period after the showcase has transitioned into its terminal Lith Harbor phase.
    server.agents.observer.AgentObserverPolicy.LITH_IDLE_MAX_MS: '35000'
    # Values: 1000-10000 milliseconds. Recommended: 2500. Higher values ignore rapid repeated F1 presses for longer; lower values allow more frequent investigations.
    # Purpose: Prevents accidental F1 key spam from repeatedly restarting Kiwi's investigation state.
    # Technical: Per-active-session millisecond debounce applied only to emote 1 packets sent by the watched character before a new investigation request can be accepted.
    server.agents.observer.AgentObserverPolicy.F1_COOLDOWN_MS: '2500'
    # Values: 25-90 map pixels. Recommended: 55. Higher values enter portals sooner; lower values require more exact positioning.
    # Purpose: Controls how close Kiwi must walk to a normal portal before using it.
    # Technical: Map-pixel radius whose squared value is compared with the observer-to-portal distance before the movement adapter requests authored portal entry.
    server.agents.observer.AgentObserverMovementController.PORTAL_DISTANCE_PX: '55'
    # Values: 25-90 map pixels. Recommended: 50. Higher values let Kiwi stop farther from an idle or investigation spot.
    # Purpose: Controls when Kiwi considers a within-map walk complete.
    # Technical: Map-pixel radius whose squared value is compared with the observer-to-destination distance before ordinary walking is considered complete.
    server.agents.observer.AgentObserverMovementController.ARRIVAL_DISTANCE_PX: '50'
    # Values: 80-350 map pixels. Recommended: 190. Higher values keep Kiwi's observation spots farther away from portals and the map entry point; lower values allow closer observation spots.
    # Purpose: Keeps Kiwi from stopping beside the portal after entering a map. Kiwi rotates through grounded foothold spots across the map on later visits.
    # Technical: Minimum straight-line map-pixel clearance used when filtering foothold midpoints against every portal and the observer's arrival position.
    server.agents.observer.AgentObserverMovementController.OBSERVATION_CLEARANCE_PX: '190'
    # Values: a positive squared map-pixel distance. Recommended: 36-144; 64 requires roughly eight pixels of movement before an Agent is considered to have made observable progress.
    # Purpose: Sets how far an Agent must move before observer diagnostics count the movement as progress. Higher values ignore more tiny position jitter; lower values report smaller movements.
    # Technical: Spectator Agent sampling compares squared positions against this threshold, avoiding a square root on every sample. Keep it below ordinary walking displacement while above packet and foothold jitter.
    server.agents.observer.SpectatorAgentSignalService.PROGRESS_DISTANCE_SQUARED: '64'
