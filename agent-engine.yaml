    # Values: integer from 0 to 100 inclusive. Recommended: 15-55 for initial tuning around the tested baseline 35; change gradually and observe crowd/load effects.
    # Purpose: Controls the visible strength or frequency of maple island full middle target. Higher values make the effect stronger or more common; lower values make it weaker or rarer.
