    # Values: 1-99 percent. Recommended: 50. The Agent announces that a kill objective is halfway complete when its live quest counter first reaches this percentage.
    # Purpose: Lower values make Agents comment earlier in a hunt; higher values delay the first progress comment.
    # Technical: Applied with ceiling rounding against authoritative quest counters, so a 5-kill objective reaches 50% at 3/5 and publishes only once per objective milestone.
    server.agents.progression.events.AgentQuestProgressMilestonePublisher.HALF_PERCENT: '50'
    # Values: 1-99 percent and greater than HALF_PERCENT. Recommended: 90. The Agent announces that a kill objective is nearly complete when its live quest counter first reaches this percentage.
    # Purpose: Lower values announce "almost done" sooner; higher values reserve it for the final kills.
    # Technical: Requirements of 10 or more use ceiling rounding (30 reaches this at 27/30). Requirements below 10 announce when one target remains (5 reaches this at 4/5).
    server.agents.progression.events.AgentQuestProgressMilestonePublisher.NEARLY_COMPLETE_PERCENT: '90'
    # Values: 50-100 percent. Recommended: 80. Higher values make Agents clear overrepresented non-objective monsters sooner; lower values tolerate a larger temporary shortage of the quest target.
    # Purpose: Keeps required quest monsters near their intended share of a mixed-spawn map, so common monsters cannot occupy nearly every available spawn slot.
    # Technical: Spawn-pressure clearing becomes eligible when the live preferred-monster share falls below this percentage of its authored spawn-point share; only overrepresented fallback species may then be selected.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.SPAWN_PRESSURE_MIN_TARGET_SHARE_PERCENT: '80'
    # Values: 20000-30000 milliseconds. Recommended: 25000. Higher values finish more local work; lower values reconsider remote objective areas sooner.
    # Purpose: Bounds how long local eligible targets retain priority after a map-wide destination is reached.
    # Technical: The lease also ends when its kill quota is consumed or its consecutive empty-scan threshold is reached.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.LOCAL_TARGET_LEASE_MS: '25000'
    # Values: 2-4 local objective kills. Recommended: 2. Higher values make the Agent clear more of the reached area before searching map-wide again.
    # Purpose: Provides a deterministic work quota alongside the time bound.
    # Technical: Authoritative kills of objective-eligible preferred or fallback mobs decrement the active lease; unrelated or disallowed kills do not.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.LOCAL_TARGET_LEASE_KILLS: '2'
    # Values: 2-3 consecutive scans. Recommended: 3. Lower values leave an exhausted area sooner; higher values tolerate short spawn gaps.
    # Purpose: Releases the lease early only when no suitable local objective target remains across repeated scans.
    # Technical: Finding any nearby preferred objective mob resets the counter; eligible nearby incidental mobs remain selectable and cannot be hidden by the lease.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.LOCAL_TARGET_LEASE_EMPTY_SCANS: '3'
    # Values: 2-8 consecutive scans. Recommended: 3. Higher values tolerate short local spawn gaps before crossing the map; lower values recover toward a remote required population sooner.
    # Purpose: Keeps ordinary quest hunting in LOCAL_CLEAR until repeated scans confirm that no required target is available in the local seek area.
    # Technical: This threshold applies before MAP_WIDE_RECOVERY and is separate from the REGION_HARVEST lease release threshold.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.MAP_WIDE_RECOVERY_EMPTY_SCANS: '3'
    # Values: 1-10 scans. Recommended: 3. Higher values preserve territory longer; lower values borrow sooner when a cell has no target.
    # Purpose: Prevents an Agent from idling forever in an exhausted assigned farming cell while keeping ordinary assignment behavior locally focused.
    # Technical: Consecutive target-acquisition scans with no mob in the active region assignment before generic combat temporarily ignores that assignment.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.REGION_ASSIGNMENT_BORROW_EMPTY_SCANS: '3'
    # Values: 1000-30000 milliseconds. Recommended: 5000. Higher values permit longer help outside a territory; lower values return sooner.
    # Purpose: Lets a field participant help a neighboring territory during short spawn droughts without permanently discarding its coordinator-issued lease.
    # Technical: Duration for which the generic combat selector may consider targets outside an otherwise valid region assignment after its empty-scan threshold.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.REGION_ASSIGNMENT_BORROW_MS: '5000'
    # Values: 1000-8000 milliseconds. Recommended: 3500. Higher values allow a wider reachable neighborhood to interrupt remote travel; lower values restrict preemption to the current platform and immediate approaches.
    # Purpose: Lets a newly nearby required mob replace a committed distant target without reintroducing remote-target thrashing.
    # Technical: A preferred candidate preempts only when its reliable route cost falls within this budget and is a better locality class than the current target.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.LOCAL_OPPORTUNITY_ROUTE_COST_MS: '3500'
    # Values: 500-10000 milliseconds. Recommended: 2500. Higher values offer more incidental destinations; lower values concentrate spawn-pressure work around the cheapest reachable region.
    # Purpose: Bounds SPAWN_PRESSURE expansion instead of allowing all incidental mobs on a large map to compete equally.
    # Technical: Retains incidental regions whose reliable route score is within this amount of the cheapest reachable incidental region.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.SPAWN_PRESSURE_ROUTE_COST_WINDOW_MS: '2500'
    # Values: 0-10 kills. Recommended: 5. Higher values let an Agent clear more non-objective monsters from its current platform before returning to a required target elsewhere; 0 disables incidental platform clearing.
    # Purpose: Prevents endless killing of convenient incidental monsters while still allowing short, natural platform sweeps that free spawn slots and reduce backtracking.
    # Technical: Maximum consecutive incidental kills selected by the quest-local-clear combat policy before required-target debt wins and the selector must return to a required candidate.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.MAX_CONSECUTIVE_INCIDENTAL_KILLS: '5'
    # Values: 0-20 kills. Recommended: 7. Higher values make a platform sweep more thorough; lower values make the Agent leave sooner for its actual quest target.
    # Purpose: Bounds how many non-objective monsters an Agent clears during one stay on a platform.
    # Technical: Separate from the consecutive-kill limit so a required kill can reset the streak without creating an unlimited platform loop inside the same navigation-region lease.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.MAX_INCIDENTAL_KILLS_PER_PLATFORM_LEASE: '7'
    # Values: 1000-20000 milliseconds. Recommended: 6500. Higher values make Agents remain locally focused longer; lower values make them reconsider other platforms more often.
    # Purpose: Gives each Agent a short-lived platform focus so it clears nearby work before repeatedly climbing up and down.
    # Technical: Resets when map or navigation region changes and bounds the incidental-kill counter for that region without changing the underlying navigation graph or attack execution.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.PLATFORM_LEASE_MS: '6500'
    # Values: 2-10 kills. Recommended: 7. Higher values clear denser platforms before routing elsewhere; lower values reconsider other platforms sooner.
    # Purpose: Bounds the soft queue of eligible monsters retained around a selected quest-combat platform.
    # Technical: The batch is revalidated on every search and releases immediately when no eligible nearby monster remains; it does not retain Monster objects or override reachability.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.PLATFORM_BATCH_MAX_KILLS: '7'
    # Values: 300-900 map pixels. Recommended: 650. Higher values treat a longer platform as one batch; lower values keep clearing near the original engagement point.
    # Purpose: Keeps a same-platform batch local instead of sweeping an entire large map region.
    # Technical: Euclidean radius around the first selected monster; navigation-region equality remains the primary platform boundary when a graph is available.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.PLATFORM_BATCH_RADIUS_PX: '650'
    # Values: 30-120 map pixels. Recommended: 70. Higher values tolerate sloped footholds when the graph is unavailable; lower values require a flatter fallback band.
    # Purpose: Provides a conservative same-height fallback for platform batching while navigation graph data is unavailable.
    # Technical: Used only when either the anchor or candidate lacks a graph region; known graph regions must match exactly.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.PLATFORM_BATCH_Y_TOLERANCE_PX: '70'
    # Values: 10000-60000 milliseconds. Recommended: 30000. Higher values preserve slow low-level fights longer; lower values re-evaluate the map sooner.
    # Purpose: Prevents a partially cleared platform batch from surviving indefinitely through movement or spawn changes.
    # Technical: Hard expiry for the soft batch; kill quota and empty-candidate release usually end it earlier.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.PLATFORM_BATCH_LEASE_MS: '30000'
    # Values: 30-160 map pixels. Recommended: 80. Higher values treat monsters farther from a travel line as blockers; lower values limit attacks to monsters almost directly in the way.
    # Purpose: Lets a travelling Agent attack genuine route obstructions without abandoning its destination to chase unrelated monsters.
    # Technical: Half-width of the line corridor used by the route-blocker target policy to classify monsters between the current position and an already-authoritative movement target.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.ROUTE_BLOCKER_CORRIDOR_WIDTH: '80'
    # Values: 500-5000 milliseconds. Recommended: 2500. Higher values allow longer fights while travelling; lower values make the Agent resume navigation sooner.
    # Purpose: Stops local-opportunity combat from turning a trip to a portal or NPC into an unbounded grind.
    # Technical: Time budget for one route-blocker interruption; expiry records an evade decision and returns control to the unchanged scripted navigation destination.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.ROUTE_BLOCKER_TIMEOUT_MS: '2500'
    # Values: 10000-60000 milliseconds. Recommended: 20000. Must be longer than ROUTE_BLOCKER_TIMEOUT_MS.
    # Purpose: Allows weak builds to finish a blocker while real damage is landing, without letting one durable or mechanically bad target hold scripted travel forever.
    # Technical: Absolute cap measured from the first interruption; accepted positive HP damage renews only the shorter inactivity timeout above.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.ROUTE_BLOCKER_HARD_TIMEOUT_MS: '20000'
    # Values: 0-5 kills. Recommended: 5. Higher values allow more clearing while travelling; 0 makes the Agent always evade instead of attacking.
    # Purpose: Lets an Agent clear up to five monsters physically blocking a quest journey, including monsters encountered on intermediate maps, without turning travel into an unrelated grind session.
    # Technical: Journey-level blocker-kill budget; waypoint and map changes preserve the count, and only authoritative route-blocker kill events consume it.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.ROUTE_BLOCKER_MAX_KILLS: '5'
    # Values: 2000-10000 milliseconds. Recommended: 5000. Higher values restore blocker capacity more slowly; lower values allow sustained clearing on heavily obstructed routes.
    # Purpose: Replenishes one consumed route-blocker kill at a time instead of imposing an all-or-nothing cooldown after five kills.
    # Technical: Token-bucket refill interval with capacity ROUTE_BLOCKER_MAX_KILLS; each authoritative selected-blocker kill consumes one token.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.ROUTE_BLOCKER_REFILL_INTERVAL_MS: '5000'
    # Values: 80-260 map pixels. Recommended: 150. Higher values treat a wider group as one AoE cluster; lower values require monsters to stand closer together before favoring an AoE attack.
    # Purpose: Controls how tightly monsters must group before the Agent values a multi-target skill over a single-target attack.
    # Technical: Radius used by the combat scoring and AoE reposition policies; this changes target valuation only and does not alter a skill's server hit box or packet target list.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.AOE_CLUSTER_RADIUS_PX: '150'
    # Values: 0-1000 score points per nearby monster. Recommended: 200. Higher values make Agents favor clustered enemies more strongly; 0 removes the cluster preference while retaining normal AoE planning.
    # Purpose: Makes groups of monsters more attractive to Agents that currently have a usable multi-target attack.
    # Technical: Additive score benefit per eligible neighbor, capped by the selected skill's mob count; the current target scoring behavior uses 200.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.AOE_CLUSTER_BONUS_PER_MOB: '200'
    # Values: 0-20 milliseconds per vertical map pixel. Recommended: 4. Higher values make vertical travel look more expensive than horizontal walking; 0 ignores height in the local travel estimate.
    # Purpose: Discourages an Agent from repeatedly crossing several platforms for a target that is only slightly closer horizontally.
    # Technical: Added to the walk-velocity travel estimate before graph reachability and policy filters are considered; the current behavior uses 4.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.LOCAL_TRAVEL_VERTICAL_COST_PER_PX: '4'
    # Values: 0-30 score points per vertical map pixel. Recommended: 8. Higher values prefer targets on a similar height; lower values make vertical separation matter less.
    # Purpose: Helps the Agent finish nearby platform work before climbing or dropping to another level.
    # Technical: Additive target-ranking cost applied to absolute vertical distance; the lowest reachable score still wins.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.LOCAL_TARGET_VERTICAL_WEIGHT: '8'
    # Values: 0-3000 score points. Recommended: 600. Higher values strongly prefer monsters inside the current attack-height band; 0 removes this extra same-level preference.
    # Purpose: Reduces attempts to attack monsters that are horizontally close but vertically outside the current attack range.
    # Technical: Added when vertical distance exceeds the active attack range; graph reachability remains authoritative.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.LOCAL_TARGET_OFF_LEVEL_PENALTY: '600'
    # Values: 0-5000 score points. Recommended: 1200. Higher values favor the current foothold more strongly; 0 ranks different footholds only by distance and graph cost.
    # Purpose: Encourages short platform sweeps and reduces unnecessary up/down movement between consecutive kills.
    # Technical: Added when the monster is not on the Agent's current foothold; objective filters and spawn-pressure policy can still require another platform.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.LOCAL_TARGET_OTHER_FOOTHOLD_PENALTY: '1200'
    # Values: 0-160 map pixels. Recommended: 60. Higher values tolerate targets slightly farther above before applying the large upward-platform penalty.
    # Purpose: Avoids over-penalizing small slopes and steps while still making substantial climbs less attractive.
    # Technical: Upward vertical distance at or below this threshold receives no additional upward-only penalty.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.UPWARD_PLATFORM_TOLERANCE_PX: '60'
    # Values: 0-10000 score points. Recommended: 2500. Higher values make a significant climb a stronger last choice; 0 leaves only the per-pixel upward penalty.
    # Purpose: Prevents Agents from abandoning useful targets on their current or lower platforms for a marginally closer monster high above.
    # Technical: One-time additive cost once upward separation exceeds the configured tolerance; the current behavior uses 2500.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.UPWARD_PLATFORM_BASE_PENALTY: '2500'
    # Values: 0-30 score points per map pixel. Recommended: 6. Higher values increasingly discourage taller climbs; 0 makes every climb above the tolerance receive only the base penalty.
    # Purpose: Distinguishes a small platform change from travelling several levels upward.
    # Technical: Applied only to upward distance beyond UPWARD_PLATFORM_TOLERANCE_PX; the current behavior uses 6.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.UPWARD_PLATFORM_PENALTY_PER_PX: '6'
    # Values: 1-10000 score points. Recommended: 100. Higher values give even weak single-target attacks a larger comparison floor against AoE attacks.
    # Purpose: Stops zero or tiny estimated damage from making every available AoE appear automatically superior.
    # Technical: Lower bound for the single-target damage score used only by attack-plan comparison; the current behavior uses 100.
    server.agents.capabilities.combat.AgentCombatPolicyConfig.MINIMUM_SINGLE_TARGET_SCORE: '100'
    # Values: 5000-60000 milliseconds. Recommended: 15000. Higher values reduce churn; lower values rebalance more aggressively.
    # Purpose: Keeps farming territories stable long enough to finish local combat while still adapting when party membership or crowd conditions change.
    # Technical: Expiry written into each AgentMapRegionAssignment; structural changes may trigger an earlier revision without bypassing combat ownership.
    server.agents.field.AgentFieldPolicyConfig.ASSIGNMENT_LEASE_MS: '15000'
    # Values: 100-5000 milliseconds. Recommended: 1000. Lower values observe crowd changes sooner; higher values reduce graph projection work.
    # Purpose: Bounds farming-cell and crowd observations so multi-Agent coordination remains responsive without rebuilding projections on every combat tick.
    # Technical: Minimum interval between coordinator observations while all participants already have unexpired assignments; missing assignments bypass this gate.
    server.agents.field.AgentFieldPolicyConfig.REFRESH_INTERVAL_MS: '1000'
    # Values: 30000-600000 milliseconds. Recommended: 120000. Higher values retain exercises longer; lower values clean abandoned sessions sooner.
    # Purpose: Releases abandoned field sessions and restores participant combat directives when no participant tick or command has refreshed their activity.
    # Technical: Map-instance session inactivity threshold evaluated by the coordinator; cleanup dispatches through each Agent mailbox before removal.
    server.agents.field.AgentFieldPolicyConfig.STALE_SESSION_MS: '120000'
    # Values: 1-6 Agents. Recommended: 6. Lower values impose a stricter exercise cap; values above six are intentionally unsupported.
    # Purpose: Keeps dynamic farming exercises within the tested party-size range and prevents accidental unbounded coordination work from GM commands.
    # Technical: Admission bound shared by explicit participants and temporary quest visitors; the deterministic allocator itself never spawns characters.
    server.agents.field.AgentFieldPolicyConfig.MAXIMUM_PARTICIPANTS: '6'
    # Values: 1-100 kills per species. Recommended: 10. Higher values create longer observations; lower values make quick smoke exercises.
    # Purpose: Gives every live mob species an equal target in automatic field exercises so target selection and coverage can be compared without quest bias.
    # Technical: Initial authoritative kill requirement generated only by the GM harness; normal quest directives retain their own objective counters.
    server.agents.field.AgentFieldPolicyConfig.TEST_OBJECTIVE_KILLS_PER_MOB: '10'
    # Values: 0-10000 score points per mob. Recommended: 1000. Higher values favor dense cells; 0 ignores target population size.
    # Purpose: Directs participants toward farming cells with more currently relevant monsters while allowing distance and stickiness to remain meaningful.
    # Technical: Additive allocator score for each live mob matching the participant intent; it affects territory choice but never combat target scoring.
    server.agents.field.AgentFieldPolicyConfig.OBJECTIVE_POPULATION_WEIGHT: '1000'
    # Values: 0-50000 score points per species. Recommended: 8000. Higher values spread mixed objectives; 0 considers only total population.
    # Purpose: Rewards cells that cover more distinct required mob species so equal multi-species exercises do not concentrate exclusively on one dense spawn.
    # Technical: Additive allocator score per distinct required mob ID present in a farming cell, evaluated independently from population weighting.
    server.agents.field.AgentFieldPolicyConfig.OBJECTIVE_COVERAGE_WEIGHT: '8000'
    # Values: 0-5000000 score points. Recommended: 1000000. Higher values make leases stickier; 0 allows every observation to choose a new seed.
    # Purpose: Prevents small position and spawn fluctuations from causing participants to oscillate between farming cells before their assignment lease expires.
    # Technical: Seed-selection bonus applied only when the previous cell remains under an unexpired assignment; structural rebalance still remains authoritative.
    server.agents.field.AgentFieldPolicyConfig.RETAINED_SEED_BONUS: '1000000'
    # Values: 0-250000 score points. Recommended: 50000. Higher values favor compact territories; 0 permits disconnected partitions more readily.
    # Purpose: Encourages each Agent's assigned farming cells to remain connected, reducing unnecessary cross-map traversal during party-size coverage changes.
    # Technical: Territory-allocation bonus when a candidate cell is mutually adjacent to a cell already owned by that participant in the runtime nav graph.
