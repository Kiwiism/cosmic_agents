    # Values: a finite non-negative integer. Recommended: 3-12 around the tested baseline 6; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how strongly kill frustration delta contributes to Agent behavior. Values nearer 1 give it more influence; values nearer 0 give it less.
    # Technical: the "behavior adaptation state" component consumes this as an integer. Domain: decimal ratio; 0.0 means none and 1.0 means the full reference amount unless the owning policy documents a wider range. The owning adaptation state adds or subtracts this magnitude per event and clamps the result to its configured state bounds.
    server.agents.behavior.AgentBehaviorAdaptationState.KILL_FRUSTRATION_DELTA: '6'
    # Values: a finite non-negative integer. Recommended: 1-4 around the tested baseline 2; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how quickly an Agent's kill rest debt adapts after this event. Values farther from zero cause a larger behavior change; values nearer zero make adaptation more gradual.
    # Technical: the "behavior adaptation state" component consumes this as an integer. Domain: component-specific policy value; startup validation rejects missing, blank, or malformed values. The owning adaptation state adds or subtracts this magnitude per event and clamps the result to its configured state bounds.
    server.agents.behavior.AgentBehaviorAdaptationState.KILL_REST_DEBT_DELTA: '2'
    # Values: a finite non-negative integer. Recommended: 50-200 around the tested baseline 100; benchmark or observe behavior before moving outside this band.
    # Purpose: Limits how many maximum state value can be handled in one pass or kept at once. Higher values let more Agent work progress together; lower values spread the work out and reduce peak load.
    # Technical: the "behavior adaptation state" component consumes this as an integer. Domain: non-negative count, capacity, or threshold unless the owning component documents a sentinel.
    server.agents.behavior.AgentBehaviorAdaptationState.MAX_STATE_VALUE: '100'
    # Values: a finite non-negative integer. Recommended: start from the tested baseline 0 and increase only when the owning policy needs a non-zero tolerance; benchmark or observe behavior before moving outside this band.
    # Purpose: Sets when minimum state value becomes available. Higher values make Agents wait for more of the condition; lower values let the behavior begin sooner.
    # Technical: the "behavior adaptation state" component consumes this as an integer. Domain: non-negative count, capacity, or threshold unless the owning component documents a sentinel.
