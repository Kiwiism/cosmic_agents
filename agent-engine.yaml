    # Technical: Linear score penalty for each cell already owned during deterministic remaining-cell allocation and for additional users sharing a seed.
    server.agents.field.AgentFieldPolicyConfig.TERRITORY_SIZE_PENALTY: '4000'
    # Values: 0-250000 score points. Recommended: 20000. Higher values avoid real players more strongly; 0 ignores their observed positions.
