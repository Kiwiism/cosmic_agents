    # Personality and bounded combat/presentation variation
    # Values: OFF or STANDARD. Recommended: STANDARD for personality-driven response timing, claim avoidance, target variation, platform anchoring, route variation, and crowd respite.
    # Purpose: Enables or disables the complete optional behavior-variation layer without changing combat or navigation correctness.
    # Technical: Cohort realism still decides which Agents receive behavior state; this profile controls whether the optional adapters are wired and consulted.
    AGENT_BEHAVIOR_PROFILE: STANDARD
    # Values: OFF or STANDARD. Recommended: STANDARD for personality presentation, idle combat presentation, and bounded combat emotes.
    # Purpose: Keeps visual presentation independent from target selection, route validation, and attack execution.
    # Technical: OFF removes optional presentation listeners and idle actions while preserving the Agent lifecycle and behavior policy.
    AGENT_PRESENTATION_PROFILE: STANDARD
