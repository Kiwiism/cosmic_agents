    # Values: a finite non-negative integer. Recommended: 10-40 around the tested baseline 20; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how long Agents wait or remain in maple island cohort telemetry retained runs. Higher values make the pause or activity last longer; lower values make them move on sooner.
    # Technical: the Agent engine deployment configuration consumes this as an integer. Domain: component-specific policy value; startup validation rejects missing, blank, or malformed values.
    AGENT_MAPLE_ISLAND_COHORT_TELEMETRY_RETAINED_RUNS: 20
    # Values: a finite non-negative integer; unit: milliseconds. Recommended: 450000-1800000 around the tested baseline 900000; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how long Agents may remain in maple island cohort objective timeout before recovery begins. Higher values wait longer; lower values retry, recover, or abandon it sooner.
    # Technical: the Agent engine deployment configuration consumes this as an integer. Unit: milliseconds; use 0 only where the owning policy explicitly treats it as immediate or disabled. It participates in bounded failure handling and should remain long enough for the normal operation to complete.
    AGENT_MAPLE_ISLAND_COHORT_OBJECTIVE_TIMEOUT_MS: 900000
    # Values: a finite non-negative integer; unit: milliseconds. Recommended: 2500-10000 around the tested baseline 5000; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how long an objective may show no measurable progress before the Agent publishes a stall notice; this threshold never injects movement.
    # Technical: The objective watchdog consumes this integer in milliseconds and emits one observation before bounded objective recovery; 0 disables the notice without changing navigation.
    AGENT_OBJECTIVE_STALL_NOTICE_MS: 5000
    # Values: a finite non-negative integer; unit: milliseconds. Recommended: 15000-30000 around the tested baseline 15000; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how long Agents remain in or wait for objective stall recovery. Higher values make that pause or state last longer; lower values make them continue sooner.
    # Technical: the Agent engine deployment configuration consumes this as an integer. Unit: milliseconds; use 0 only where the owning policy explicitly treats it as immediate or disabled. It participates in bounded failure handling and should remain long enough for the normal operation to complete.
    AGENT_OBJECTIVE_STALL_RECOVERY_MS: 15000
    # Values: a finite non-negative integer. Recommended: 10-40 around the tested baseline 20; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how many times Agents retry objective automatic recovery attempts before switching recovery strategy or giving up. Higher values persist longer; lower values fail over sooner.
    # Technical: the Agent engine deployment configuration consumes this as an integer. Domain: non-negative count, capacity, or threshold unless the owning component documents a sentinel. It participates in bounded failure handling and should remain long enough for the normal operation to complete.
    AGENT_OBJECTIVE_AUTO_RECOVERY_ATTEMPTS: 20
    # Values: a finite non-negative integer; unit: milliseconds. Recommended: 250-1000 around the tested baseline 500; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how long Agents remain in or wait for objective recovery delay. Higher values make that pause or state last longer; lower values make them continue sooner.
    # Technical: the Agent engine deployment configuration consumes this as an integer. Unit: milliseconds; use 0 only where the owning policy explicitly treats it as immediate or disabled. It participates in bounded failure handling and should remain long enough for the normal operation to complete.
    AGENT_OBJECTIVE_RECOVERY_DELAY_MS: 500

    # Authority and compatibility
    # Values: a comma-separated IGN allowlist; an empty string means nobody. Recommended: keep the list minimal and grant only the narrowest required authority (tested baseline Kiwi).
    # Purpose: Lists the character names used for authority administrator names. Separate multiple names with commas; an empty value grants the role to nobody.
    # Technical: the Agent engine deployment configuration consumes this as a text. Domain: non-negative count, capacity, or threshold unless the owning component documents a sentinel.
    AGENT_AUTHORITY_ADMINISTRATOR_NAMES: Kiwi,AgentForSure
    # Values: a comma-separated IGN allowlist; an empty string means nobody. Recommended: keep the list minimal and grant only the narrowest required authority (tested baseline empty).
    # Purpose: Lists the character names used for authority operator names. Separate multiple names with commas; an empty value grants the role to nobody.
    # Technical: the Agent engine deployment configuration consumes this as a text. Domain: component-specific policy value; startup validation rejects missing, blank, or malformed values.
    AGENT_AUTHORITY_OPERATOR_NAMES: ''
    # Values: a comma-separated IGN allowlist; an empty string means nobody. Recommended: keep the list minimal and grant only the narrowest required authority (tested baseline empty).
    # Purpose: Lists the character names used for authority observer names. Separate multiple names with commas; an empty value grants the role to nobody.
    # Technical: the Agent engine deployment configuration consumes this as a text. Domain: component-specific policy value; startup validation rejects missing, blank, or malformed values.
    AGENT_AUTHORITY_OBSERVER_NAMES: ''
    # Values: a comma-separated IGN allowlist; an empty string means nobody. Recommended: keep the list minimal and grant only the narrowest required authority (tested baseline Kiwi).
    # Purpose: Lists the character names used for trusted trade player names. Separate multiple names with commas; an empty value grants the role to nobody.
    # Technical: the Agent engine deployment configuration consumes this as a text. Domain: component-specific policy value; startup validation rejects missing, blank, or malformed values.
    AGENT_TRUSTED_TRADE_PLAYER_NAMES: Kiwi

    # World Director rollout
    # Values: true or false. Recommended: false until a named Agent canary has passed manual rollback tests.
    # Purpose: Enables policy-produced Assisted-mode handoffs only for the explicitly configured Agent cohort below.
    # Technical: This deployment gate is checked before directive claim; false leaves durable directives pending and cannot release an activity owner.
    AGENT_WORLD_DIRECTOR_ASSISTED_ENABLED: false
    # Values: comma-separated positive character ids, or none. Recommended: one test Agent id before expanding a canary.
    # Purpose: Restricts Assisted-mode execution to reviewed Agent identities so observation and manual control remain unaffected.
    # Technical: The loader parses this allowlist strictly before constructing the immutable canary policy; invalid ids fail startup on first access.
    AGENT_WORLD_DIRECTOR_ASSISTED_AGENT_IDS: none
    # Values: a finite non-negative integer. Recommended: 0 while disabled and 1 during the first Assisted canary.
    # Purpose: Bounds simultaneous Assisted ownership transfers to prevent a configuration mistake from moving a large Agent cohort.
    # Technical: Capacity is evaluated immediately before directive claim and is independent of ordinary child-system scheduler concurrency.
    AGENT_WORLD_DIRECTOR_ASSISTED_MAX_CONCURRENT_HANDOFFS: 0
    # Values: comma-separated QUESTING,HUNTING,TOWN_LIFE,COMMERCE,PARTY_QUEST, or none. Recommended: none while disabled.
    # Purpose: Limits which destination systems an Assisted-mode policy may request while manual operator directives remain separately governed.
    # Technical: Values map strictly to AgentActivityKind and are checked before source suspension, transfer, or destination admission begins.
    AGENT_WORLD_DIRECTOR_ASSISTED_ALLOWED_TARGETS: none
    # Values: true or false. Recommended: true so every canary source must support exact-session rollback.
    # Purpose: Prevents an Assisted transfer from releasing a source activity that cannot be restored if destination admission later fails.
    # Technical: The gate reads the source system's live facade readiness evidence before the durable handoff coordinator is allowed to begin.
    AGENT_WORLD_DIRECTOR_ASSISTED_REQUIRE_ROLLBACK: true
    # Values: true or false. Recommended: false until Assisted canary evidence and restart recovery have been accepted.
    # Purpose: Enables policy-produced Autonomous directives only after every independent cohort, evidence, capacity, and rollback gate passes.
    # Technical: False is fail-closed before directive claim and does not disable read-only Observe sampling or explicitly submitted manual work.
    AGENT_WORLD_DIRECTOR_AUTONOMOUS_ENABLED: false
    # Values: 0-10000 basis points. Recommended: 0 while disabled, then no more than 100 for the first percentage rollout.
    # Purpose: Selects a deterministic portion of Agent ids for Autonomous eligibility without changing identities between server restarts.
    # Technical: Explicit ids are included independently; remaining ids use a stable integer hash compared with this basis-point threshold.
    AGENT_WORLD_DIRECTOR_AUTONOMOUS_ROLLOUT_BASIS_POINTS: 0
    # Values: comma-separated positive character ids, or none. Recommended: reviewed test Agents before percentage rollout.
    # Purpose: Allows precise Autonomous canaries without enabling an entire hashed cohort while lifecycle behavior is still being observed.
    # Technical: The immutable rollout policy combines this explicit set with the deterministic basis-point cohort and rejects malformed ids.
    AGENT_WORLD_DIRECTOR_AUTONOMOUS_AGENT_IDS: none
    # Values: a finite non-negative integer. Recommended: 0 while disabled and 1 during the first Autonomous canary.
    # Purpose: Bounds simultaneous Autonomous ownership transfers independently from Assisted and ordinary activity scheduler capacity.
    # Technical: The live execution gate compares the current durable handoff count before a policy-produced directive can be claimed.
    AGENT_WORLD_DIRECTOR_AUTONOMOUS_MAX_CONCURRENT_HANDOFFS: 0
    # Values: a finite non-negative integer. Recommended: at least 100 read-only samples before initial Autonomous eligibility.
    # Purpose: Requires enough prior Observe evidence to expose unstable proposals before automatic activity ownership is permitted.
    # Technical: This threshold consumes session-local restored sample evidence and never grants authority by itself when other gates are closed.
    AGENT_WORLD_DIRECTOR_AUTONOMOUS_MIN_OBSERVE_SAMPLES: 100
    # Values: a finite non-negative integer. Recommended: 0 during the first rollout and raise only after failure handling is validated.
    # Purpose: Blocks Autonomous execution when recent Director failures exceed the explicitly accepted deployment error budget.
    # Technical: The count is evaluated before directive claim; blocking preserves the current child owner and the pending durable directive.
    AGENT_WORLD_DIRECTOR_AUTONOMOUS_MAX_RECENT_FAILURES: 0
    # Values: comma-separated QUESTING,HUNTING,TOWN_LIFE,COMMERCE,PARTY_QUEST, or none. Recommended: none while disabled.
    # Purpose: Limits Autonomous destination systems independently of proposal generation, allowing each activity adapter to be rolled out safely.
    # Technical: Values map strictly to AgentActivityKind and a mismatch blocks before source suspension or destination-specific code executes.
    AGENT_WORLD_DIRECTOR_AUTONOMOUS_ALLOWED_TARGETS: none
    # Values: true or false. Recommended: true for every Autonomous deployment stage.
    # Purpose: Requires exact source-session recovery so rejected travel or destination admission cannot discard the Agent's previous work.
    # Technical: The source facade must report rollback support before the persistent handoff state machine is allowed to release execution.
    AGENT_WORLD_DIRECTOR_AUTONOMOUS_REQUIRE_ROLLBACK: true
# Strict runtime/algorithm tuning. Keys mirror declaring classes for traceability.
tuning:
    # Values: a positive integer; unit: milliseconds. Recommended: 15000-60000; 30000 allows one bounded plan step to settle without making ownership replacement unbounded.
    # Purpose: Sets the default deadline for a universal quest plan to finish its current atomic step before a forced ownership release.
    # Technical: This deadline applies only to foreground replacement requests without a caller-authored deadline; explicit plan session exit requests retain their own validated timing.
    server.agents.plans.AgentUniversalPlanRuntime.DEFAULT_GRACEFUL_EXIT_TIMEOUT_MS: '30000'
    # Values: a positive integer; unit: milliseconds. Recommended: 250-1000; 500 preserves the validated simulation cadence.
    # Purpose: Controls how often automatic logical-time advancement polls for additional due economy work.
    # Technical: This is the process-level automatic economy scheduler interval; it controls polling frequency without changing logical event timestamps or scenario-authored session durations.
    server.agents.observation.commerce.CommerceScenarioRuntime.AUTO_ADVANCE_POLL_MS: '500'
    # Values: a positive integer. Recommended: 32-128; 64 bounds work per automatic scheduler pass.
    # Purpose: Limits how many due economy actions one automatic advancement pass may process before yielding.
    # Technical: This is a scheduling fairness and latency bound; it neither limits Agent population nor changes market capacity, session ownership, or scenario admission policy.
    server.agents.observation.commerce.CommerceScenarioRuntime.AUTO_ADVANCE_BATCH_ACTIONS: '64'
    # Values: a positive integer; unit: milliseconds. Recommended: 500-2000; 1000 preserves the validated real-time cadence.
    # Purpose: Controls how often real-time economy mode polls its logical clock for newly due scenario work.
    # Technical: This is the process-level real-time scheduler interval; economic visit durations, idle deadlines, and market actions remain owned by the loaded economy scenario configuration.
    server.agents.observation.commerce.CommerceScenarioRuntime.REALTIME_POLL_MS: '1000'
    # Independent Kiwi observer showcase
    # Values: 25-100 milliseconds. Recommended: 50. Lower values make Kiwi's server-driven walking smoother; higher values reduce work but can make motion look stepped.
    # Purpose: Sets how often only the independent observer controller updates. This does not change normal Agent plan, combat, or TownLife scheduling.
    # Technical: Dedicated fixed-rate observer scheduler cadence in milliseconds; it bounds how often observer policy and movement are evaluated without changing the normal Agent scheduler cadence.
    server.agents.observer.AgentObserverRuntime.TICK_MS: '50'
    # Values: 70-180 map pixels. Recommended: 110. Higher values make Kiwi observe from farther away; lower values make Kiwi stand closer to the watched character.
    # Purpose: Controls Kiwi's normal following distance after Bari's Test is complete.
    # Technical: Horizontal map-pixel offset used by the SHADOWING stage when the observer movement controller derives a grounded destination beside the watched character.
    server.agents.observer.AgentObserverRuntime.SHADOW_DISTANCE_PX: '110'
    # Values: 25-90 map pixels. Recommended: 55. Higher values keep more space during an F1 investigation; lower values make Kiwi approach more closely.
    # Purpose: Controls how close Kiwi gets before showing the suspicious F3 expression.
    # Technical: Horizontal map-pixel offset used only by the INVESTIGATING stage when deriving the observer's grounded inspection destination beside the watched character.
    server.agents.observer.AgentObserverRuntime.INVESTIGATION_DISTANCE_PX: '55'
    # Values: 6000-30000 milliseconds. Recommended: 12000. Higher values make Kiwi linger longer in each Maple Island map; lower values make the patrol advance sooner.
    # Purpose: Sets the shortest casual idle between ordinary roaming-map transitions.
    # Technical: Inclusive millisecond lower bound sampled by observer policy whenever the ordinary roaming state schedules its next map transition.
    server.agents.observer.AgentObserverPolicy.IDLE_MIN_MS: '12000'
    # Values: 12000-60000 milliseconds. Recommended: 30000 and no lower than IDLE_MIN_MS. Higher values produce a slower, more patient patrol.
    # Purpose: Sets the longest casual idle between ordinary roaming-map transitions.
    # Technical: Inclusive millisecond upper bound sampled by observer policy whenever the ordinary roaming state schedules its next map transition.
    server.agents.observer.AgentObserverPolicy.IDLE_MAX_MS: '30000'
    # Values: 2000-8000 milliseconds. Recommended: 3500. Higher values make training-map spot checks last longer.
    # Purpose: Sets the shortest time Kiwi briefly observes an isolated Mai training map before returning to the three-map cycle.
    # Technical: Inclusive millisecond lower bound sampled after the observer enters an isolated training-map excursion before it resumes the normal roaming route.
    server.agents.observer.AgentObserverPolicy.EXCURSION_MIN_MS: '3500'
    # Values: 4000-15000 milliseconds. Recommended: 7000 and no lower than EXCURSION_MIN_MS. Higher values make isolated training-map spot checks more noticeable.
    # Purpose: Sets the longest time Kiwi remains in an isolated Mai training map.
    # Technical: Inclusive millisecond upper bound sampled after the observer enters an isolated training-map excursion before it resumes the normal roaming route.
    server.agents.observer.AgentObserverPolicy.EXCURSION_MAX_MS: '7000'
    # Values: 0-100 percent. Recommended: 15. Higher values make Kiwi interrupt the normal Dangerous Forest-Amherst-Mai cycle with isolated-map checks more often.
    # Purpose: Controls how often a completed cycle-map idle becomes a brief training-map observation.
    # Technical: Integer percentage threshold applied to one independent random roll at each eligible observer roaming-cycle decision boundary.
    server.agents.observer.AgentObserverPolicy.EXCURSION_CHANCE_PERCENT: '15'
    # Values: 2000-10000 milliseconds. Recommended: 5000. Higher values make Kiwi glare suspiciously for longer after reaching the F1 caller.
    # Purpose: Controls the visible pause at the end of an F1 investigation.
    # Technical: Millisecond dwell scheduled after expression 3 is broadcast and the observer has reached its inspection destination, before normal roaming resumes.
    server.agents.observer.AgentObserverPolicy.INVESTIGATION_HOLD_MS: '5000'
    # Values: 10000-60000 milliseconds. Recommended: 30000. Higher values give Kiwi more time to navigate across several maps before abandoning an unreachable F1 investigation.
    # Purpose: Bounds a failed or obstructed investigation so the normal roaming cycle always resumes.
    # Technical: Millisecond hard deadline measured from entry into the INVESTIGATING stage; expiry releases a failed or unreachable inspection and restores normal roaming.
    server.agents.observer.AgentObserverPolicy.INVESTIGATION_TIMEOUT_MS: '30000'
    # Values: 5000-30000 milliseconds. Recommended: 15000. Higher values make Kiwi change Lith Harbor idle spots less often.
    # Purpose: Sets the shortest idle between Kiwi's Lith Harbor spot changes after Shanks administration.
    # Technical: Inclusive millisecond lower bound sampled for each observer idle period after the showcase has transitioned into its terminal Lith Harbor phase.
    server.agents.observer.AgentObserverPolicy.LITH_IDLE_MIN_MS: '15000'
    # Values: 15000-60000 milliseconds. Recommended: 35000 and no lower than LITH_IDLE_MIN_MS. Higher values make Kiwi settle at each Lith Harbor spot longer.
    # Purpose: Sets the longest idle between Kiwi's Lith Harbor spot changes.
    # Technical: Inclusive millisecond upper bound sampled for each observer idle period after the showcase has transitioned into its terminal Lith Harbor phase.
    server.agents.observer.AgentObserverPolicy.LITH_IDLE_MAX_MS: '35000'
    # Values: 1000-10000 milliseconds. Recommended: 2500. Higher values ignore rapid repeated F1 presses for longer; lower values allow more frequent investigations.
    # Purpose: Prevents accidental F1 key spam from repeatedly restarting Kiwi's investigation state.
    # Technical: Per-active-session millisecond debounce applied only to emote 1 packets sent by the watched character before a new investigation request can be accepted.
    server.agents.observer.AgentObserverPolicy.F1_COOLDOWN_MS: '2500'
    # Values: 25-90 map pixels. Recommended: 55. Higher values enter portals sooner; lower values require more exact positioning.
    # Purpose: Controls how close Kiwi must walk to a normal portal before using it.
    # Technical: Map-pixel radius whose squared value is compared with the observer-to-portal distance before the movement adapter requests authored portal entry.
    server.agents.observer.AgentObserverMovementController.PORTAL_DISTANCE_PX: '55'
    # Values: 25-90 map pixels. Recommended: 50. Higher values let Kiwi stop farther from an idle or investigation spot.
    # Purpose: Controls when Kiwi considers a within-map walk complete.
    # Technical: Map-pixel radius whose squared value is compared with the observer-to-destination distance before ordinary walking is considered complete.
    server.agents.observer.AgentObserverMovementController.ARRIVAL_DISTANCE_PX: '50'
    # Values: 80-350 map pixels. Recommended: 190. Higher values keep Kiwi's observation spots farther away from portals and the map entry point; lower values allow closer observation spots.
    # Purpose: Keeps Kiwi from stopping beside the portal after entering a map. Kiwi rotates through grounded foothold spots across the map on later visits.
    # Technical: Minimum straight-line map-pixel clearance used when filtering foothold midpoints against every portal and the observer's arrival position.
    server.agents.observer.AgentObserverMovementController.OBSERVATION_CLEARANCE_PX: '190'
    # Values: a positive squared map-pixel distance. Recommended: 36-144; 64 requires roughly eight pixels of movement before an Agent is considered to have made observable progress.
    # Purpose: Sets how far an Agent must move before observer diagnostics count the movement as progress. Higher values ignore more tiny position jitter; lower values report smaller movements.
    # Technical: Spectator Agent sampling compares squared positions against this threshold, avoiding a square root on every sample. Keep it below ordinary walking displacement while above packet and foothold jitter.
    server.agents.observer.SpectatorAgentSignalService.PROGRESS_DISTANCE_SQUARED: '64'
    # Values: a finite non-negative integer. Recommended: 12-50 around the tested baseline 25; benchmark or observe behavior before moving outside this band.
    # Purpose: Limits how many maximum per controller can be handled in one pass or kept at once. Higher values let more Agent work progress together; lower values spread the work out and reduce peak load.
    # Technical: the "provisioning policy" component consumes this as an integer. Domain: non-negative count, capacity, or threshold unless the owning component documents a sentinel.
    server.agents.auth.AgentProvisioningPolicy.DEFAULT_MAX_PER_CONTROLLER: '25'
    # Values: a finite non-negative integer. Recommended: 1-6 around the tested baseline 3; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how long Agents wait or remain in maximum per window. Higher values make the pause or activity last longer; lower values make them move on sooner.
    # Technical: the "provisioning policy" component consumes this as an integer. Domain: non-negative count, capacity, or threshold unless the owning component documents a sentinel.
    server.agents.auth.AgentProvisioningPolicy.DEFAULT_MAX_PER_WINDOW: '6'
    # Values: a finite non-negative integer. Recommended: 3-12 around the tested baseline 6; benchmark or observe behavior before moving outside this band.
    # Purpose: Sets when minimum game master level becomes available. Higher values make Agents wait for more of the condition; lower values let the behavior begin sooner.
    # Technical: the "provisioning policy" component consumes this as an integer. Domain: non-negative count, capacity, or threshold unless the owning component documents a sentinel.
    server.agents.auth.AgentProvisioningPolicy.DEFAULT_MINIMUM_GM_LEVEL: '6'
    # Values: a finite non-negative integer. Recommended: 1-2 around the tested baseline 1; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how quickly an Agent's attack energy adapts after this event. Values farther from zero cause a larger behavior change; values nearer zero make adaptation more gradual.
    # Technical: the "behavior adaptation state" component consumes this as an integer. Domain: component-specific policy value; startup validation rejects missing, blank, or malformed values. The owning adaptation state adds or subtracts this magnitude per event and clamps the result to its configured state bounds.
    server.agents.behavior.AgentBehaviorAdaptationState.ATTACK_ENERGY_DELTA: '1'
    # Values: a finite non-negative integer. Recommended: 1-2 around the tested baseline 1; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how quickly an Agent's attack rest debt adapts after this event. Values farther from zero cause a larger behavior change; values nearer zero make adaptation more gradual.
    # Technical: the "behavior adaptation state" component consumes this as an integer. Domain: component-specific policy value; startup validation rejects missing, blank, or malformed values. The owning adaptation state adds or subtracts this magnitude per event and clamps the result to its configured state bounds.
    server.agents.behavior.AgentBehaviorAdaptationState.ATTACK_REST_DEBT_DELTA: '1'
    # Values: a finite non-negative integer. Recommended: 2-8 around the tested baseline 4; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls the divisor used to combine an Agent's energy, confidence, frustration, and rest debt into combat drive. Higher values reduce aggression; lower values make Agents more eager to fight.
    # Technical: the "behavior adaptation state" component consumes this as an integer. Domain: component-specific policy value; startup validation rejects missing, blank, or malformed values.
    server.agents.behavior.AgentBehaviorAdaptationState.COMBAT_DRIVE_COMPONENTS: '4'
    # Values: a finite non-negative integer. Recommended: 1-4 around the tested baseline 2; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how quickly an Agent's hit confidence adapts after this event. Values farther from zero cause a larger behavior change; values nearer zero make adaptation more gradual.
    # Technical: the "behavior adaptation state" component consumes this as an integer. Domain: component-specific policy value; startup validation rejects missing, blank, or malformed values. The owning adaptation state adds or subtracts this magnitude per event and clamps the result to its configured state bounds.
    server.agents.behavior.AgentBehaviorAdaptationState.HIT_CONFIDENCE_DELTA: '2'
    # Values: a finite non-negative integer. Recommended: 1-6 around the tested baseline 3; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how strongly hit frustration delta contributes to Agent behavior. Values nearer 1 give it more influence; values nearer 0 give it less.
    # Technical: the "behavior adaptation state" component consumes this as an integer. Domain: decimal ratio; 0.0 means none and 1.0 means the full reference amount unless the owning policy documents a wider range. The owning adaptation state adds or subtracts this magnitude per event and clamps the result to its configured state bounds.
    server.agents.behavior.AgentBehaviorAdaptationState.HIT_FRUSTRATION_DELTA: '3'
    # Values: a finite non-negative integer. Recommended: 25-100 around the tested baseline 50; benchmark or observe behavior before moving outside this band.
    # Purpose: Sets an Agent's starting initial confidence before current conditions adjust it. Higher values make that tendency stronger from the start; lower values make it weaker.
    # Technical: the "behavior adaptation state" component consumes this as an integer. Domain: component-specific policy value; startup validation rejects missing, blank, or malformed values.
