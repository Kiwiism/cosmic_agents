    # Technical: The pure field allocator multiplies relevant live population and the immutable combat-profile density preference by this score weight.
    server.agents.field.AgentFieldPolicyConfig.CAPABILITY_DENSITY_WEIGHT: '20'
    # Values: 0-100 score points per pixel-preference unit. Recommended: 1. Higher values favor wider horizontal firing platforms for ranged roles.
