    # Values: a finite non-negative integer. Recommended: 2-8 around the tested baseline 4; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how strongly miss frustration delta contributes to Agent behavior. Values nearer 1 give it more influence; values nearer 0 give it less.
    # Technical: the "behavior adaptation state" component consumes this as an integer. Domain: decimal ratio; 0.0 means none and 1.0 means the full reference amount unless the owning policy documents a wider range. The owning adaptation state adds or subtracts this magnitude per event and clamps the result to its configured state bounds.
    server.agents.behavior.AgentBehaviorAdaptationState.MISS_FRUSTRATION_DELTA: '4'
    # Values: a finite non-negative integer. Recommended: 12-50 around the tested baseline 25; benchmark or observe behavior before moving outside this band.
    # Purpose: Controls how quickly an Agent's rest debt adapts after this event. Values farther from zero cause a larger behavior change; values nearer zero make adaptation more gradual.
