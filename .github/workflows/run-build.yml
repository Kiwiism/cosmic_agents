name: Build and test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5.6.0
      with:
        java-version: '21'
        distribution: 'corretto'
        cache: maven
    - name: Build with Maven (compile -> test -> package)
      run: ./mvnw -B verify
